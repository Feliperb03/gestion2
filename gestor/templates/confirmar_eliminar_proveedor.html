<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Eliminar Proveedor</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  {% load static %}
</head>
<body class="p-4">
  <div class="container">
    <h3>Eliminar Proveedor</h3>
    <p>¿Estás seguro que deseas eliminar al proveedor <strong>{{ proveedor.nombre_pro }}</strong> ({{ proveedor.rut_pro }})?</p>
    <form method="post">
      {% csrf_token %}
      <button type="submit" class="btn btn-danger">Eliminar</button>
      <a class="btn btn-secondary" href="{% url 'proveedores' %}">Cancelar</a>
    </form>
  </div>
</body>
</html>
