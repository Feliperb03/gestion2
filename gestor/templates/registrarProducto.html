<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Registrar producto • Punto de Venta</title>
<!-- Bootstrap 5 -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<!-- Bootstrap Icons -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
{% load static %}

<style>
:root{
  --sidebar-bg:#111827;
  --sidebar-bg-hover:#0b1220;
  --sidebar-text:#e5e7eb;
  --sidebar-muted:#94a3b8;
  --primary-100:#e6f0ff;
}
html,body{height:100%;}
body{background:#f5f6fa;}

/* LAYOUT */
.layout{
  min-height:100vh;
  display:grid;
  grid-template-columns:280px 1fr;
  grid-template-rows:auto 1fr;
  grid-template-areas:
    "sidebar topbar"
    "sidebar main";
}

/* SIDEBAR */
.sidebar{grid-area:sidebar;background:var(--sidebar-bg);color:var(--sidebar-text);}
.sidebar .brand{height:64px;padding:0 1rem;border-bottom:1px solid rgba(255,255,255,.06);}
.sidebar .brand .btn{color:var(--sidebar-text)}
.sidebar .profile{padding:1.25rem 1rem;border-bottom:1px solid rgba(255,255,255,.06)}
.avatar{
  width:72px;height:72px;border-radius:50%;
  background:linear-gradient(145deg,#fbbf24,#ef4444);
  display:grid;place-items:center;color:white;font-size:2rem;font-weight:700;
  box-shadow:0 8px 24px rgba(0,0,0,.35);
}
.sidebar a{color:var(--sidebar-text);text-decoration:none}
.sidebar .nav-link{color:var(--sidebar-text);opacity:.9;border-radius:.75rem;padding:.6rem 0.85rem}
.sidebar .nav-link:hover{background:var(--sidebar-bg-hover);opacity:1}
.sidebar .nav-link .bi{margin-right:.5rem}
.sidebar .nav .collapse .nav-link{padding-left:2.3rem;opacity:.85}
.sidebar small{color:var(--sidebar-muted)}

/* TOPBAR */
.topbar{grid-area:topbar;background:#ffffff;border-bottom:1px solid #e5e7eb;position:sticky;top:0;z-index:10}
.topbar .search-input{max-width:380px}

/* MAIN */
.main{grid-area:main;padding:1.25rem;}

/* ------- Estilos del formulario ------- */
.card-shell{
  background:#e9eef5;
  border:0;
  border-radius:1.25rem;
  box-shadow:0 8px 24px rgba(16,24,40,.06);
}
.underline-input .form-control{
  border:0;border-bottom:2px solid rgba(0,0,0,.15);
  border-radius:0;background:transparent;box-shadow:none;padding-left:0;
}
.underline-input .form-control:focus{
  border-bottom-color:#3b82f6;
  box-shadow: inset 0 -2px 0 #3b82f6;
}
.input-group-text.bg-none{background:transparent;border:0;color:#6b7280;padding-left:0;}
.btn-save{padding:.9rem 1.6rem;border-radius:.9rem;font-weight:600;}
/* -------------------------------------- */

@media (max-width: 992px){
  .layout{grid-template-columns:0 1fr}
  .sidebar{position:fixed;inset:0 auto 0 0;width:260px;transform:translateX(-100%);transition:transform .25s ease}
  .sidebar.show{transform:none}
}
</style>
</head>

<body>
<div class="layout">
  <!-- Sidebar -->
  <aside id="sidebar" class="sidebar d-flex flex-column">
    <div class="brand d-flex align-items-center justify-content-between">
      <a class="d-flex align-items-center text-decoration-none" href="#">
        <i class="bi bi-box-seam fs-4 me-2"></i>
        <span class="fw-semibold">Gestor de Inventario</span>
      </a>
      <button class="btn btn-sm d-lg-none" id="closeSidebar" aria-label="Cerrar menú">
        <i class="bi bi-x-lg"></i>
      </button>
    </div>

    <div class="profile text-center">
      <div class="mx-auto avatar mb-2">A</div>
      <div class="fw-semibold">Administrador</div>
      <small>Administrador</small>
    </div>

    <nav class="flex-grow-1 p-2">
      <div class="px-2 text-uppercase small mb-2" style="color:var(--sidebar-muted)">Menú</div>
      <a class="nav-link" href="{% url 'main' %}"><i class="bi bi-speedometer2 me-2"></i>Dashboard</a>
      <ul id="sidebarMenu" class="nav flex-column gap-1">
        <li class="nav-item">
          <a class="nav-link d-flex align-items-center" data-bs-toggle="collapse" href="#admMenu"
             role="button" aria-expanded="true" aria-controls="admMenu">
            <i class="bi bi-gear me-2"></i>
            <span>Administración</span>
            <i class="bi bi-chevron-down ms-auto chevron"></i>
          </a>
          <div class="collapse show" id="admMenu" data-bs-parent="#sidebarMenu">
            <a class="nav-link active" href="{% url 'registrarProducto' %}">
              <i class="bi bi-box me-2"></i>Productos
            </a>
            <a class="nav-link" href="{% url 'historial' %}"><i class="bi bi-tags me-2"></i>Historial</a>
            <a class="nav-link" href="{% url 'kardex' %}"><i class="bi bi-clipboard-data me-2"></i>Kardex</a>
            <a class="nav-link" href="{% url 'proveedores' %}"><i class="bi bi-building me-2"></i>Proveedores</a>
            <a class="nav-link" href="{% url 'empleados' %}"><i class="bi bi-people me-2"></i>Empleados</a>
            <a class="nav-link" href="{% url 'reportes' %}"><i class="bi bi-bar-chart-line me-2"></i>Reportes</a>
          </div>
        </li>
        <a class="nav-link" href="{% url 'login' %}"><i class="bi bi-box-arrow-right me-2"></i>Logout</a>
      </ul>
    </nav>
  </aside>

  <!-- MAIN -->
  <main class="main">
    <h3>Registrar nuevo producto</h3>
    <p class="text-muted">Completa los campos para agregar un producto al sistema.</p>

    <!-- ====== Formulario (reemplaza a las cards) ====== -->
    <section class="container-fluid mt-3">
      <div class="card card-shell p-4 p-md-5">
        <form>
          <div class="row g-4">
            <!-- Nombre -->
            <div class="col-md-6 underline-input">
              <label class="form-label small fw-semibold">
                <i class="bi bi-pencil me-1"></i> Nombre
              </label>
              <div class="input-group">
                <span class="input-group-text bg-none"><i class="bi bi-pencil"></i></span>
                <input type="text" class="form-control" placeholder="Ej: Luces">
              </div>
            </div>

            <!-- Código de barras -->
            <div class="col-md-6 underline-input">
              <label class="form-label small fw-semibold">
                <i class="bi bi-upc-scan me-1"></i> Código de barras
              </label>
              <div class="input-group">
                <span class="input-group-text bg-none"><i class="bi bi-upc-scan"></i></span>
                <input type="text" class="form-control" placeholder="EAN/UPC">
              </div>
            </div>

            <!-- Marca + -->
            <div class="col-md-6">
              <label class="form-label small fw-semibold">
                <i class="bi bi-gear-wide-connected me-1"></i> Marca
              </label>
              <div class="d-flex gap-2">
                <select class="form-select flex-grow-1">
                  <option selected>Genérica</option>
                  <option>ACME</option>
                  <option>Otra…</option>
                </select>
                <button type="button" class="btn btn-light border shadow-sm" aria-label="Agregar marca">
                  <i class="bi bi-plus-lg"></i>
                </button>
              </div>
            </div>

            <!-- Código interno -->
            <div class="col-md-6 underline-input">
              <label class="form-label small fw-semibold">
                <i class="bi bi-key me-1"></i> Código interno
              </label>
              <div class="input-group">
                <span class="input-group-text bg-none"><i class="bi bi-key"></i></span>
                <input type="text" class="form-control" placeholder="SKU interno">
              </div>
            </div>

            <!-- Stock -->
            <div class="col-md-6 underline-input">
              <label class="form-label small fw-semibold">
                <i class="bi bi-box-seam me-1"></i> Stock
              </label>
              <div class="input-group">
                <span class="input-group-text bg-none"><i class="bi bi-box-seam"></i></span>
                <input type="number" min="0" class="form-control" placeholder="0">
              </div>
            </div>

            <!-- Precio venta -->
            <div class="col-md-6 underline-input">
              <label class="form-label small fw-semibold">
                <i class="bi bi-cash-stack me-1"></i> Precio de venta
              </label>
              <div class="input-group">
                <span class="input-group-text bg-none"><i class="bi bi-cash-stack"></i></span>
                <input type="number" step="0.01" min="0" class="form-control" placeholder="0.00">
              </div>
            </div>

            <!-- Stock mínimo -->
            <div class="col-md-6 underline-input">
              <label class="form-label small fw-semibold">
                <i class="bi bi-bell me-1"></i> Stock mínimo
              </label>
              <div class="input-group">
                <span class="input-group-text bg-none"><i class="bi bi-bell"></i></span>
                <input type="number" min="0" class="form-control" placeholder="0">
              </div>
            </div>

            <!-- Precio compra -->
            <div class="col-md-6 underline-input">
              <label class="form-label small fw-semibold">
                <i class="bi bi-wallet2 me-1"></i> Precio de compra
              </label>
              <div class="input-group">
                <span class="input-group-text bg-none"><i class="bi bi-wallet2"></i></span>
                <input type="number" step="0.01" min="0" class="form-control" placeholder="0.00">
              </div>
            </div>

            <!-- Categoría + -->
            <div class="col-md-6">
              <label class="form-label small fw-semibold">
                <i class="bi bi-diagram-3 me-1"></i> Categoría
              </label>
              <div class="d-flex gap-2">
                <select class="form-select flex-grow-1">
                  <option selected>General</option>
                  <option>Iluminación</option>
                  <option>Accesorios</option>
                </select>
                <button type="button" class="btn btn-light border shadow-sm" aria-label="Agregar categoría">
                  <i class="bi bi-plus-lg"></i>
                </button>
              </div>
            </div>
            <!-- Proveedor -->
            <div class="col-md-6">
              <label class="form-label small fw-semibold">
                <i class="bi bi-diagram-3 me-1"></i> Proveedor Rut
              </label>
              <div class="d-flex gap-2">
                <select class="form-select flex-grow-1">
                  <option selected>11.111.111-1</option>
                  <option>22.222.222-2</option>
                </select>
              </div>
            </div>

            <!-- Botón guardar -->
            <div class="col-12">
              <div class="d-flex justify-content-end">
                <button type="submit" class="btn btn-primary btn-save">
                  <i class="bi bi-save me-2"></i> Guardar
                </button>
              </div>
            </div>

          </div>
        </form>
      </div>
    </section>
    <!-- ====== /Formulario ====== -->

  </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
